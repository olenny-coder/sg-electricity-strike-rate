<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Strike — Singapore business electricity price advisory. Real USEP, regulated tariff and demand response analytics."
    />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="color-scheme" content="light dark" />
    <title>Strike · Singapore Electricity Price Advisory</title>
    <script>
      /* Resolve the theme before first paint so there is no flash of the wrong
         colour scheme. Kept inline and tiny on purpose. */
      (function () {
        try {
          var p = localStorage.getItem("strike.theme") || "system";
          var dark =
            p === "dark" ||
            (p === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = dark ? "dark" : "light";
          document.documentElement.dataset.theme = r;
          document.documentElement.style.colorScheme = r;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#0A0F1E" : "#F8FAFC");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
