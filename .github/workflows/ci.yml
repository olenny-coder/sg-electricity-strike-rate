# Continuous integration.
#
# Every step corresponds to an npm script rather than an inline shell command, so
# each one can be reproduced locally with the same result. The previous version
# used `npm --prefix web exec tsc -- --noEmit`, which silently passed no
# arguments to tsc: it printed its help text, exited -1 and failed the build,
# skipping every step behind it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch; there is no point
# finishing a build for a commit that is already history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # --include=dev is explicit. CI needs devDependencies (the Vite/tsc
      # toolchain, and PGlite for the storage tests), and stating it here makes
      # the workflow immune to a NODE_ENV being introduced later. The same
      # omission under NODE_ENV=production is what produced
      # "sh: 1: vite: not found" on Render.
      - name: Install dependencies
        run: |
          npm ci --include=dev
          npm --prefix web ci --include=dev

      - name: Typecheck the client
        run: npm run typecheck

      - name: Build the client
        run: npm run build:web

      # Runs the real Postgres store against PGlite — Postgres compiled to WASM —
      # so the production SQL is executed rather than merely compiled. Without
      # this, a typo in the Postgres layer would only surface on the first
      # production deploy, because local development uses SQLite.
      - name: Test the Postgres storage layer
        run: npm test

      # Boots the real server against a throwaway empty database and asserts the
      # contract the client depends on. Allocates its own port and tears itself
      # down, so it cannot race another step for a port.
      - name: Smoke test the running server
        run: npm run test:smoke

      # Useful signal, but a transitive advisory should not block a deploy.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
